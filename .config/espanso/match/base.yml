# Espanso base config — identity links, dates, Obsidian, code snippets
# Triggers prefixed with ; to avoid accidental expansion
# Phone/address/DOB live in an untracked match/private.yml (see private.yml.example).
# Work triggers live in an untracked work file on the work machine only.

matches:
  # ── Identity ──────────────────────────────────
  - trigger: ";name"
    replace: "Kevin Lee"

  - trigger: ";pemail"
    replace: "kevincorvallis@gmail.com"

  - trigger: ";pid"
    replace: "kevincorvallis@gmail.com"

  - trigger: ";bemail"
    replace: "kevin@pookieb.com"

  - trigger: ";city"
    replace: "Los Angeles"

  - trigger: ";state"
    replace: "CA"

  - trigger: ";country"
    replace: "United States"

  - trigger: ";gh"
    word: true
    replace: "https://github.com/kevincorvallis"

  - trigger: ";li"
    replace: "https://www.linkedin.com/in/klee0813"

  - trigger: ";cal"
    replace: "https://calendar.google.com/calendar/appointments/schedules/AcZssZ0lsiOVD3Cv9SR7O0Pp8y2PILR4zYaKCvaZ5zirsYavh0Mkos01gQ77h_Pfg4XGFJFX58-hjXpG?gv=true"

  - trigger: ";site"
    replace: "https://klee.page"

  # ── Dates & Time ──────────────────────────────
  - trigger: ";today"
    replace: "{{date}}"
    vars:
      - name: date
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ";now"
    replace: "{{date}}"
    vars:
      - name: date
        type: date
        params:
          format: "%Y-%m-%d %H:%M"

  - trigger: ";iso"
    replace: "{{date}}"
    vars:
      - name: date
        type: date
        params:
          format: "%Y-%m-%dT%H:%M:%S%z"

  # ── Obsidian ──────────────────────────────────
  - trigger: ";fm"
    replace: |
      ---
      title: $|$
      date: {{date}}
      tags: []
      type: reference
      ---
    vars:
      - name: date
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ";task"
    replace: "- [ ] "

  - trigger: ";done"
    replace: "- [x] "

  - trigger: ";wip"
    replace: "- [/] "

  - trigger: ";cancel"
    replace: "- [-] "

  # ── Code Snippets ─────────────────────────────
  - trigger: ";ifmain"
    replace: |
      if __name__ == "__main__":
          $|$

  - trigger: ";pdb"
    replace: "import pdb; pdb.set_trace()"

  - trigger: ";bpdb"
    replace: "breakpoint()"
