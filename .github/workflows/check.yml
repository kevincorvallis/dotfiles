name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      GITHUB_TOKEN: ${{ github.token }}
      # ERE of work identifiers check.sh must not find; kept out of this public repo
      DOTFILES_DENYLIST: ${{ secrets.DOTFILES_DENYLIST }}
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run checks (macOS /bin/bash 3.2)
        run: /bin/bash scripts/check.sh
